[project]
name = "accored"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "ulid-py>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true

[tool.black]
line-length = 100
target-version = ["py314"]
